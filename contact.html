<div style="margin:0; padding:0; background-color:#f3f4f6;">
<div style="font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; max-width:600px; margin:0 auto; padding:24px 16px;">

  <!-- Card -->
  <div style="background-color:#ffffff; border:1px solid #e5e7eb; border-radius:12px; overflow:hidden;">

    <!-- Header -->
    <div style="background-color:#ea580c; padding:24px 28px;">
      <div style="color:#ffedd5; font-size:13px; letter-spacing:1px; text-transform:uppercase; font-weight:700;">Νεο μηνυμα απο τον ιστοτοπο</div>
      <div style="color:#ffffff; font-size:22px; font-weight:700;">{{name}}</div>
    </div>

    <!-- Fields -->
    <div style="padding:8px 28px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
        <tr>
          <td style="padding:14px 0; border-bottom:1px solid #f3f4f6;">
            <div style="color:#9ca3af; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Email</div>
            <div style="color:#1f2937; font-size:16px; margin-top:4px;">{{from_email}}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 0; border-bottom:1px solid #f3f4f6;">
            <div style="color:#9ca3af; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Τηλεφωνο</div>
            <div style="color:#1f2937; font-size:16px; margin-top:4px;">{{phone}}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 0; border-bottom:1px solid #f3f4f6;">
            <div style="color:#9ca3af; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Κατηγορια &amp; περιοχη επιχειρησης</div>
            <div style="color:#1f2937; font-size:16px; margin-top:4px;">{{business_category}}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:14px 0;">
            <div style="color:#9ca3af; font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:700;">Ωρες διαθεσιμοτητας</div>
            <div style="color:#1f2937; font-size:16px; margin-top:4px;">{{availability}}</div>
          </td>
        </tr>
      </table>
    </div>

    <!-- Footer -->
    <div style="background-color:#f9fafb; padding:16px 28px; border-top:1px solid #e5e7eb;">
      <div style="color:#6b7280; font-size:13px;">Απάντησε στον αποστολέα απαντώντας σε αυτό το email ή κάλεσέ τον στο {{phone}}.</div>
    </div>

  </div>

</div>
</div>
